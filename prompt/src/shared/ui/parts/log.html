<div class="card log-card">
  <div class="log-head">
    <strong id="log-title">Логи агента</strong>
    <div class="log-meta">
      <span>Длительность: <span id="log-duration">—</span></span>
      <span id="log-counter"></span>
    </div>
  </div>
  <div class="log-controls">
    <input
      id="log-search"
      class="log-search"
      type="text"
      placeholder="Поиск по событиям..."
      autocomplete="off"
      spellcheck="false"
      aria-label="Поиск по логам"
    />
    <div class="log-actions">
      <div class="log-filters" id="log-filter" role="tablist">
        <button type="button" data-event-filter="important" class="active">Важные</button>
        <button type="button" data-event-filter="full">Полный</button>
      </div>
      <div class="log-view" id="log-view" role="tablist">
        <button type="button" data-mode="cards" class="active">Карточки</button>
        <button type="button" data-mode="short">Кратко</button>
        <button type="button" data-mode="full">Полностью</button>
      </div>
      <button type="button" id="copy-log" title="Скопировать полный текст видимых логов">Копировать</button>
    </div>
  </div>
  <div class="log-body" id="log-body" data-mode="short">
    <p class="log-empty">Нет данных.</p>
  </div>
</div>
